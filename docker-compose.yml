version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: smart_planter_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-smart_planter}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_planter_api
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-smart_planter};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres_secure_pass}"
      ASPNETCORE_ENVIRONMENT: "Development"
    ports:
      - "8000:8080"
    depends_on:
      - db

  iot_bot:
    build: ./iot_bot
    container_name: smart_planter_bot
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - BACKEND_API_URL=http://backend:8080/api/v1/Telemetry
    depends_on:
      - backend

volumes:
  pgdata:
